<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05061a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Aman Patel — Software engineer building resilient backend systems, distributed platforms, and thoughtfully engineered products."
    />
    <meta property="og:title" content="Aman Patel — Software Engineer" />
    <meta
      property="og:description"
      content="Backend engineer crafting scalable, high-performance systems with Java, Spring Boot, and modern cloud infrastructure."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Aman Patel — Software Engineer</title>
    <script>
      // Applies the correct theme class before paint to avoid FOUC.
      (function () {
        try {
          var stored = localStorage.getItem('ap-portfolio-theme');
          var isDark = stored ? stored === 'dark' : false; // default to light
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
